<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>浏览器翻译插件</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="logo">译<span class="arrow">AI</span></span>
        <div class="titles">
          <div class="title">浏览器翻译插件</div>
          <div class="subtitle">全文翻译 · 选中翻译</div>
        </div>
      </div>
      <button id="settingsBtn" class="icon-btn" title="设置">⚙</button>
    </header>

    <div id="warn" class="warn hidden">
      <span>尚未配置 DeepSeek API Key</span>
      <button id="warnBtn" class="link-btn">去设置</button>
    </div>

    <main class="main">
      <section class="card">
        <div class="card-head">
          <label for="targetLang">全文翻译当前网页</label>
          <span class="count">Alt+Shift+T</span>
        </div>
        <div class="actions lang-row">
          <select id="pageSourceLang" title="源语言"></select>
          <span class="lang-arrow">→</span>
          <select id="targetLang" title="目标语言"></select>
        </div>
        <div class="actions">
          <select id="pageMode" title="显示样式">
            <option value="bilingual">双语对照</option>
            <option value="translation">只显示译文</option>
          </select>
          <button id="restoreBtn" class="ghost-btn">恢复原文</button>
          <button id="pageBtn" class="primary-btn">翻译此页</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <label for="input">单条翻译</label>
          <span id="count" class="count">0</span>
        </div>
        <div class="actions lang-row">
          <select id="sourceLang" title="源语言"></select>
          <span class="lang-arrow">→</span>
          <select id="popupTargetLang" title="目标语言"></select>
        </div>
        <textarea id="input" rows="5" placeholder="输入要翻译的内容…（Ctrl + Enter 翻译）"></textarea>
        <div class="actions">
          <select id="style" title="译文风格">
            <option value="natural">自然日常</option>
            <option value="formal">商务正式</option>
            <option value="academic">学术严谨</option>
            <option value="casual">简短口语</option>
            <option value="email">礼貌邮件</option>
          </select>
          <button id="clearBtn" class="ghost-btn" title="清空">清空</button>
          <button id="translateBtn" class="primary-btn">翻译</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <label for="output">译文</label>
          <span id="status" class="status"></span>
        </div>
        <textarea id="output" rows="5" placeholder="翻译结果会出现在这里…"></textarea>
        <div class="actions">
          <button id="copyBtn" class="ghost-btn">复制</button>
          <button id="insertBtn" class="soft-btn" title="填入当前网页里正在编辑的输入框">填入网页输入框</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      右键页面 →「DeepSeek 全文翻译此页」· 选中文字右键 →「用 AI 翻译为…」（目标语言同下方「单条翻译」）<br />
      快捷键：全文 Alt+Shift+T · 选中 Alt+Shift+S · 恢复 Alt+Shift+R（可在 chrome://extensions/shortcuts 修改）
    </footer>
  </div>
  <script src="langs.js"></script>
  <script src="popup.js"></script>
</body>
</html>
